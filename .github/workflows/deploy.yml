name: Deploy Blog

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # apt's pandoc jumps major versions whenever the runner image is upgraded
      # (2.9.2.1 on Ubuntu 22.04 -> 3.1.3 on 24.04), which broke HTML generation.
      # Fetch a fixed release so the build is reproducible and upgrades are
      # deliberate rather than surprise side effects of a runner image update.
      - name: Install Pandoc (pinned)
        env:
          PANDOC_VERSION: 3.8.3
        run: |
          curl -fsSL \
            "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-linux-amd64.tar.gz" \
            -o /tmp/pandoc.tar.gz
          tar -xzf /tmp/pandoc.tar.gz -C /tmp
          echo "/tmp/pandoc-${PANDOC_VERSION}/bin" >> "$GITHUB_PATH"
          "/tmp/pandoc-${PANDOC_VERSION}/bin/pandoc" --version | head -1

      - name: Build Blog
        run: |
          python scripts/build.py
          cp style.css dist/
          cp CNAME dist/

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true 
          cname: panayang.blog.apich.org
